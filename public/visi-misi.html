<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visi & Misi Kandidat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        const SERVER_URL = `http://${window.location.hostname}:8080`;
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        * { font-family: 'Inter', sans-serif; }

        body {
            background: linear-gradient(135deg, #fafafa 0%, #f5f5f5 100%);
        }

        .modern-header {
            background: linear-gradient(135deg, #e91e63 0%, #c2185b 100%);
            border-radius: 1.125rem;
            box-shadow: 0 4px 24px rgba(233, 30, 99, 0.15);
        }

        .header-logo {
            height: 70px;
        }

        .card {
            background: white;
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(0, 0, 0, 0.03);
            transition: .35s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 28px rgba(0,0,0,0.10);
        }
    </style>
</head>
<body class="min-h-screen p-4">

    <div class="max-w-5xl mx-auto">
        <!-- HEADER -->
        <header class="modern-header p-6 mb-8 flex justify-between items-center text-white">
            <div class="flex items-center space-x-4">
                <img src="./image/hima-infor.png" class="header-logo"
                     onerror="this.src='https://placehold.co/100x50?text=LOGO'">
                <div>
                    <h1 class="text-3xl sm:text-4xl font-bold tracking-tight">Visi & Misi Kandidat</h1>
                    <p class="text-pink-100 text-sm mt-1">Pemilihan Ketua Umum HMIF ITATS</p>
                </div>
            </div>

            <a href="index.html"
               class="bg-white/20 backdrop-blur-lg border border-white/40 px-4 py-2 rounded-lg font-medium hover:bg-white/30 transition">
                ← Kembali
            </a>
        </header>

        <!-- LIST VISI MISI -->
        <section>
            <h2 class="text-2xl font-bold mb-6 text-pink-600">Daftar Kandidat</h2>

            <div id="visi-misi-list" class="space-y-6">
                <!-- Auto Loaded -->
            </div>
        </section>
    </div>

    <script>
        async function loadVisiMisi() {
            const container = document.getElementById("visi-misi-list");
            container.innerHTML = `<p class="text-gray-600">Memuat data kandidat...</p>`;

            try {
                const response = await fetch(`${SERVER_URL}/options`);
                const data = await response.json();

                container.innerHTML = data.map(c => `
                    <div class="card flex flex-col sm:flex-row gap-6">

                        <!-- FOTO KANDIDAT -->
                        <img src="${c.photo ? `${SERVER_URL}/${c.photo}` : './image/default-user.png'}"
                                class="w-32 h-32 rounded-xl object-cover border shadow">
                             

                        <!-- DETAIL -->
                        <div class="flex-1">
                            <h3 class="text-xl font-bold text-gray-800">${c.name}</h3>
                            <p class="text-sm text-gray-500">NPM: ${c.npm || "-"}</p>
                            <p class="text-sm text-gray-500 mb-3">No. Urut: ${c.no_urut}</p>

                            <p class="mt-1">
                                <span class="font-semibold text-pink-600">Visi:</span><br>
                                <span class="text-gray-700">${c.visi}</span>
                            </p>

                            <p class="mt-3">
                                <span class="font-semibold text-pink-600">Misi:</span><br>
                                <span class="text-gray-700 whitespace-pre-line">${c.misi}</span>
                            </p>
                        </div>

                    </div>
                `).join("");

            } catch (err) {
                container.innerHTML = `
                    <p class="text-red-500 font-medium">
                        Gagal memuat data kandidat. Pastikan server berjalan.
                    </p>
                `;
            }
        }

        loadVisiMisi();
    </script>

</body>
</html>
