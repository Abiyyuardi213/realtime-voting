<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem E-Voting Real-Time</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <script>
        const SERVER_URL = `http://${window.location.hostname}:8080`;

        const voter_id = localStorage.getItem("voter_id");
        if (!voter_id) {
            window.location.href = "login.html";
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        * {
            font-family: 'Inter', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #fafafa 0%, #f5f5f5 100%);
        }
        .card {
            background: white;
            border-radius: 0.875rem;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            transition: all 0.3s cubic-bezier(0.23, 1, 0.320, 1);
            border: 1px solid rgba(0, 0, 0, 0.03);
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }
        .vote-btn {
            background: linear-gradient(135deg, #e91e63 0%, #c2185b 100%);
            transition: all 0.3s cubic-bezier(0.23, 1, 0.320, 1);
            border: none;
            position: relative;
            overflow: hidden;
        }
        .vote-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(233, 30, 99, 0.25);
            filter: brightness(1.05);
        }
        .vote-btn:active {
            transform: translateY(0);
        }
        .title-gradient {
            background: linear-gradient(135deg, #e91e63 0%, #c2185b 100%);
        }
        .modern-header {
            background: linear-gradient(135deg, #e91e63 0%, #c2185b 100%);
            border-radius: 1.125rem;
            box-shadow: 0 4px 24px rgba(233, 30, 99, 0.15);
            transition: all 0.3s ease;
        }
        .logout-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 0.625rem 1.25rem;
            border-radius: 0.75rem;
            font-size: 0.9375rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.320, 1);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            white-space: nowrap;
        }
        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-1px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
        }
        .logout-btn:active {
            transform: translateY(0);
        }
        .logout-icon {
            width: 18px;
            height: 18px;
            display: inline-block;
        }
        .result-card {
            background: white;
            border-radius: 0.875rem;
            padding: 1.25rem;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.03);
        }
        .section-title {
            background: linear-gradient(135deg, #e91e63 0%, #c2185b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }
        .header-logo {
            height: 70px;
            width: auto;
            object-fit: contain;
            border-radius: 0;
            box-shadow: none;
            background: none;
        }
        button {
            transition: all 0.3s cubic-bezier(0.23, 1, 0.320, 1);
        }
    </style>
</head>
<body class="min-h-screen p-4">
    <header class="modern-header p-6 mb-8 flex justify-between items-center text-white">
        <!-- Logo dan Judul -->
        <div class="flex items-center space-x-4">
            <img id="header-logo"
                src="./image/hima-infor.png"
                alt="Logo HMIF ITATS"
                class="header-logo"
                onerror="this.onerror=null; this.src='https://placehold.co/80x40?text=LOGO';"
            >
            <div>
                <h1 class="text-3xl sm:text-4xl font-bold tracking-tight">E-Voting HMIF ITATS</h1>
                <p class="text-pink-100 text-sm mt-1">
                    Ketua Umum Himpunan Program Studi Teknik Informatika
                </p>
            </div>
        </div>

        <!-- Selamat Datang + Menu -->
        <div class="flex flex-col sm:flex-row items-end sm:items-center gap-3 text-right sm:text-left">

            <div class="text-sm">
                <p class="text-pink-100">Selamat datang,</p>
                <p class="font-semibold text-base" id="welcome-user"></p>
            </div>

            <!-- MENU VISI MISI -->
            <a href="visi-misi.html" class="logout-btn">
                <svg class="logout-icon" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                </svg>
                Visi & Misi
            </a>

            <!-- 🔥 MENU HASIL VOTING (baru ditambahkan) -->
            <a href="hasil-voting.html" class="logout-btn">
                <svg class="logout-icon" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M3 13h2v-2H3v2zm4 0h14v-2H7v2zm0 6h14v-2H7v2zM3 19h2v-2H3v2zm4-14v2h14V5H7zm-4 2h2V5H3v2z"/>
                </svg>
                Hasil Voting
            </a>

            <!-- BUTTON LOGOUT -->
            <button onclick="logout()" class="logout-btn">
                <svg class="logout-icon" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4
                            c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
                </svg>
                Logout
            </button>

        </div>
    </header>

    <div class="max-w-5xl mx-auto">
        <section id="voting-section" class="mb-10">
            <h2 class="section-title text-2xl sm:text-3xl font-bold mb-6">Calon Kandidat</h2>
            <div id="options" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            <div id="voted-message"
                class="hidden bg-emerald-50 border border-emerald-200 text-emerald-700 px-6 py-4 rounded-xl mt-6 card font-medium">
                <span class="font-semibold">✓ Terima kasih!</span> Suara Anda telah tercatat dengan aman.
            </div>
        </section>

        <hr class="my-8 border-gray-200">
        <section>
            <h2 class="section-title text-2xl sm:text-3xl font-bold mb-6">Hasil Suara Real-Time</h2>
            
            <div class="card p-6 mb-8">
                <canvas id="voteChart"></canvas>
            </div>
            
            <ul id="results" class="space-y-3"></ul>
        </section>
    </div>

    <script src="script.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        document.getElementById("welcome-user").textContent =
            localStorage.getItem("username");

        function logout() {
            localStorage.removeItem("voter_id");
            localStorage.removeItem("username");
            localStorage.removeItem("is_voted");
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
