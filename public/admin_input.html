<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Data Calon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>const SERVER_URL = `http://${window.location.hostname}:8080`;</script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f5f5 0%, #fafafa 100%);
        }

        .input-field {
            transition: all 0.3s ease;
            border: 1px solid #e0e0e0;
        }

        .input-field:focus {
            outline: none;
            border-color: #e91e63;
            box-shadow: 0 0 0 3px rgba(233, 30, 99, 0.1);
        }

        .submit-btn {
            background: linear-gradient(135deg, #e91e63 0%, #c2185b 100%);
            transition: all 0.3s ease;
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(233, 30, 99, 0.3);
        }

        .submit-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .card-shadow {
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.08);
        }

        .success-alert {
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center py-10 px-4">

<div class="card-shadow bg-white rounded-2xl p-6 sm:p-8 md:p-10 w-full max-w-lg">

    <div class="text-center mb-6 md:mb-8">
        <h1 class="text-2xl md:text-3xl font-bold text-gray-900">Input Data Calon Ketua</h1>
        <p class="text-gray-500 text-sm">Masukkan informasi lengkap calon</p>
    </div>

    <div id="alertMessage" class="hidden success-alert px-4 py-3 rounded-lg relative mb-4"></div>

    <form id="candidateForm" class="space-y-4">
        <div>
            <label class="block text-gray-700 font-semibold mb-1">Nomor Urut *</label>
            <input id="no_urut" name="no_urut" type="number" required class="input-field w-full px-3 py-2 rounded-lg bg-gray-50" />
        </div>

        <div>
            <label class="block text-gray-700 font-semibold mb-1">Nama Lengkap *</label>
            <input id="name" name="name" type="text" required class="input-field w-full px-3 py-2 rounded-lg bg-gray-50" />
        </div>

        <div>
            <label class="block text-gray-700 font-semibold mb-1">NPM</label>
            <input id="npm" name="npm" type="text" class="input-field w-full px-3 py-2 rounded-lg bg-gray-50" />
        </div>

        <div>
            <label class="block text-gray-700 font-semibold mb-1">Visi *</label>
            <textarea id="visi" name="visi" rows="3" required class="input-field w-full px-3 py-2 rounded-lg bg-gray-50"></textarea>
        </div>

        <div>
            <label class="block text-gray-700 font-semibold mb-1">Misi *</label>
            <textarea id="misi" name="misi" rows="5" required class="input-field w-full px-3 py-2 rounded-lg bg-gray-50"></textarea>
        </div>

        <div>
            <label class="block text-gray-700 font-semibold mb-1">Foto Calon (Max 2MB)</label>
            <input id="photo" name="photo" type="file" accept="image/*" class="input-field w-full p-2 rounded-lg bg-gray-50" />
        </div>

        <button id="submitButton" type="submit" class="submit-btn w-full text-white py-2.5 rounded-lg font-semibold text-sm">
            Simpan Calon
        </button>
    </form>
</div>

<script>
function showAlert(message, isSuccess = false) {
    const alertDiv = document.getElementById("alertMessage");
    alertDiv.textContent = message;
    alertDiv.classList.remove("hidden");

    alertDiv.className = isSuccess
        ? "success-alert bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg mb-4"
        : "success-alert bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-4";

    setTimeout(() => alertDiv.classList.add("hidden"), 6000);
}

async function handleFormSubmit(event) {
    event.preventDefault();

    const form = event.target;
    const formData = new FormData(form);
    const submitButton = document.getElementById("submitButton");

    const requiredFields = ["no_urut", "name", "visi", "misi"];
    for (const field of requiredFields) {
        if (!document.getElementById(field).value.trim()) {
            showAlert("Field bertanda (*) wajib diisi!");
            return;
        }
    }

    submitButton.disabled = true;
    submitButton.textContent = "Menyimpan...";

    try {
        const response = await fetch(`${SERVER_URL}/admin/options`, {
            method: "POST",
            body: formData,
        });

        const data = await response.json();

        if (data.error) {
            showAlert(data.message || "Gagal menyimpan data calon.");
        } else {
            showAlert(data.message || "Data calon berhasil disimpan!", true);
            form.reset();
        }
    } catch (err) {
        showAlert("Terjadi kesalahan koneksi atau server.");
    } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Simpan Calon";
    }
}

document.getElementById("candidateForm").addEventListener("submit", handleFormSubmit);
</script>

</body>
</html>
