<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Input Data Calon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>const SERVER_URL = "http://localhost:8080";</script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

<div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-xl">
    <h1 class="text-2xl font-bold text-center mb-6 text-indigo-700">Input Data Calon Ketua</h1>

    <div id="alertMessage" class="hidden border px-4 py-3 rounded relative mb-4" role="alert">
        <span id="alertText" class="block sm:inline"></span>
    </div>

    <form id="candidateForm">
        
        <div class="mb-4">
            <label for="no_urut" class="block text-gray-700 font-bold mb-2">Nomor Urut *</label>
            <input id="no_urut" name="no_urut" type="number" required class="w-full border px-3 py-2 rounded focus:ring-2 focus:ring-indigo-500">
        </div>

        <div class="mb-4">
            <label for="name" class="block text-gray-700 font-bold mb-2">Nama Lengkap *</label>
            <input id="name" name="name" type="text" required class="w-full border px-3 py-2 rounded focus:ring-2 focus:ring-indigo-500">
        </div>

        <div class="mb-4">
            <label for="npm" class="block text-gray-700 font-bold mb-2">NPM</label>
            <input id="npm" name="npm" type="text" class="w-full border px-3 py-2 rounded focus:ring-2 focus:ring-indigo-500">
        </div>

        <div class="mb-4">
            <label for="visi" class="block text-gray-700 font-bold mb-2">Visi *</label>
            <textarea id="visi" name="visi" rows="3" required class="w-full border px-3 py-2 rounded focus:ring-2 focus:ring-indigo-500"></textarea>
        </div>

        <div class="mb-4">
            <label for="misi" class="block text-gray-700 font-bold mb-2">Misi *</label>
            <textarea id="misi" name="misi" rows="5" required class="w-full border px-3 py-2 rounded focus:ring-2 focus:ring-indigo-500"></textarea>
        </div>

        <div class="mb-6">
            <label for="photo" class="block text-gray-700 font-bold mb-2">Foto Calon (max 2MB)</label>
            <input id="photo" type="file" name="photo" accept="image/*" class="w-full border p-2 rounded focus:ring-2 focus:ring-indigo-500">
        </div>

        <button 
            type="submit"
            id="submitButton"
            class="w-full bg-indigo-600 text-white py-2 rounded font-semibold hover:bg-indigo-800 transition duration-150">
            Simpan Calon
        </button>
    </form>
</div>

<script>
document.getElementById('candidateForm').addEventListener('submit', handleFormSubmit);

/**
 * Fungsi untuk menampilkan pesan peringatan atau sukses
 */
function showAlert(message, isSuccess = false) {
    const alertDiv = document.getElementById("alertMessage");
    const alertText = document.getElementById("alertText");
    
    alertText.textContent = message;
    alertDiv.classList.remove("hidden");
    
    alertDiv.className = isSuccess 
        ? "bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4" 
        : "bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4";
    
    setTimeout(() => {
        alertDiv.classList.add("hidden");
    }, 6000);
}


/**
 * Fungsi untuk menangani pengiriman formulir
 */
async function handleFormSubmit(event) {
    event.preventDefault();

    const form = event.target;
    // FormData(form) otomatis mengambil semua input (termasuk file)
    const formData = new FormData(form); 
    const submitButton = document.getElementById("submitButton");

    // Lakukan validasi dasar di sisi klien
    const no_urut = document.getElementById('no_urut').value.trim();
    const name = document.getElementById('name').value.trim();
    const visi = document.getElementById('visi').value.trim();
    const misi = document.getElementById('misi').value.trim();


    if (!no_urut || !name || !visi || !misi) {
        showAlert("Field bertanda (*) wajib diisi!", false);
        return;
    }

    submitButton.disabled = true;
    submitButton.textContent = "Menyimpan Data...";

    try {
        // Mengirim FormData, HANYA body yang dikirim, tidak perlu header 'Content-Type'
        const response = await fetch(`${SERVER_URL}/admin/options`, {
            method: 'POST',
            body: formData, 
        });

        const data = await response.json();

        if (data.error) {
            showAlert(data.message || "Gagal menyimpan data calon.", false);
        } else {
            showAlert(data.message || "Data calon berhasil disimpan!", true);
            form.reset(); // Kosongkan form setelah sukses
        }

    } catch (error) {
        console.error("Kesalahan jaringan/server:", error);
        showAlert("Terjadi kesalahan koneksi atau server.", false);
    } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Simpan Calon";
    }
}
</script>

</body>
</html>
