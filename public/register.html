<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Daftar Pemilih Baru</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>const SERVER_URL = "http://localhost:8080";</script>
</head>

<body class="bg-indigo-700 min-h-screen flex items-center justify-center">

<div class="bg-white p-8 rounded-xl shadow-lg w-96">
    <h1 class="text-2xl font-bold text-center mb-6 text-indigo-700">Pendaftaran Pemilih</h1>

    <div id="alertMessage" class="hidden border px-4 py-3 rounded relative mb-4" role="alert">
        <span id="alertText" class="block sm:inline"></span>
    </div>

    <div class="mb-4">
        <label for="username" class="block text-gray-700 text-sm font-bold mb-2">Username</label>
        <input 
            id="username" 
            class="w-full border px-3 py-2 rounded focus:outline-none focus:ring-2 focus:ring-indigo-500" 
            placeholder="Buat Username"
            type="text">
    </div>

    <div class="mb-4">
        <label for="password" class="block text-gray-700 text-sm font-bold mb-2">Password</label>
        <input 
            id="password" 
            class="w-full border px-3 py-2 rounded focus:outline-none focus:ring-2 focus:ring-indigo-500" 
            placeholder="Buat Password"
            type="password">
    </div>

    <div class="mb-6">
        <label for="npm" class="block text-gray-700 text-sm font-bold mb-2">NPM (Opsional)</label>
        <input 
            id="npm" 
            class="w-full border px-3 py-2 rounded focus:outline-none focus:ring-2 focus:ring-indigo-500" 
            placeholder="NPM Mahasiswa (jika ada)"
            type="text"
            onkeypress="if(event.key === 'Enter') registerUser()">
    </div>

    <button 
        id="registerButton"
        onclick="registerUser()" 
        class="mt-2 w-full bg-indigo-600 text-white py-2 rounded font-semibold hover:bg-indigo-800 transition duration-150 ease-in-out">
        Daftar
    </button>
    
    <p class="mt-4 text-center text-sm text-gray-600">
        Sudah punya akun? 
        <a href="login.html" class="text-indigo-600 hover:text-indigo-800 font-semibold">Login di sini</a>
    </p>
</div>

<script>

function showAlert(message, isSuccess = false) {
    const alertDiv = document.getElementById("alertMessage");
    const alertText = document.getElementById("alertText");
    
    alertText.textContent = message;
    alertDiv.classList.remove("hidden");
    
    if (isSuccess) {
        alertDiv.className = "bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4";
    } else {
        alertDiv.className = "bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4";
    }

    setTimeout(() => {
        alertDiv.classList.add("hidden");
    }, 6000);
}

async function registerUser() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const npm = document.getElementById("npm").value.trim();
    const registerButton = document.getElementById("registerButton");

    if (!username || !password) {
        showAlert("Username dan Password wajib diisi!");
        return;
    }

    registerButton.disabled = true;
    registerButton.textContent = "Mendaftarkan...";

    try {
        const response = await fetch(`${SERVER_URL}/register`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({ username, password, npm }),
        });

        const data = await response.json();

        if (data.error) {
            showAlert(data.message || "Pendaftaran gagal.");
        } else {
            showAlert(data.message || "Pendaftaran berhasil! Silakan Login.", true);
            setTimeout(() => {
                window.location.href = "login.html";
            }, 3000);
        }
    } catch (error) {
        console.error("Kesalahan jaringan/server:", error);
        showAlert("Terjadi kesalahan koneksi ke server.");
    } finally {
        registerButton.disabled = false;
        registerButton.textContent = "Daftar";
    }
}
</script>

</body>
</html>
